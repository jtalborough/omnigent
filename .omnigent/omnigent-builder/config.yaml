spec_version: 1
name: omnigent-builder
description: >-
  Builder for the jtalborough/omnigent fork. Takes one ticket from its lead
  (Rai), writes the code and tests on a branch, opens a PR against the fork's
  main with evidence, and never merges. Never touches the upstream repo.

executor:
  type: omnigent
  config:
    harness: hermes

instructions: instructions.md

# Started by its lead as a child session on the lead's host, so it runs as
# that Linux user. The model key comes from the host's env (1Password at
# launch). Only variable NAMES here. GitHub comes from the Keeper broker.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
    env_passthrough:
      - RAI_LLM_KEY
      - SSL_CERT_FILE
      - REQUESTS_CA_BUNDLE

tool_groups:
  browser: false

# Writes only to the fork, and only on builder/* branches. main and merges are refused.
guardrails:
  ask_timeout: 86400
  policies:
    github_scope:
      type: function
      function:
        path: omnigent.policies.builtins.github.github_policy
        arguments:
          write_repos:
            - jtalborough/omnigent
          write_branches:
            - builder/*
    blast_radius:
      type: function
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
